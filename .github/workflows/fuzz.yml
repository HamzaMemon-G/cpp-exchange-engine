name: Command fuzzing
on:
  push:
    paths: ['src/commands.cpp', 'src/engine.cpp', 'include/exchange/**', 'tests/fuzz/**', 'CMakeLists.txt', '.github/workflows/fuzz.yml']
  pull_request:
    paths: ['src/commands.cpp', 'src/engine.cpp', 'include/exchange/**', 'tests/fuzz/**', 'CMakeLists.txt', '.github/workflows/fuzz.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clang-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build covered parser and core with sanitizers
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++ -DEXCHANGE_FUZZER=ON
          cmake --build build-fuzz --target exchange_command_fuzz --parallel 2
      - name: Fuzz for two minutes
        run: |
          set -o pipefail
          mkdir -p fuzz-artifacts
          ./build-fuzz/exchange_command_fuzz tests/fuzz/corpus -dict=tests/fuzz/commands.dict -max_total_time=120 -timeout=5 -rss_limit_mb=1024 -max_len=4096 -seed=42 -artifact_prefix=fuzz-artifacts/ 2>&1 | tee fuzz-artifacts/fuzzer.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: command-fuzz-results
          path: fuzz-artifacts/
